name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release-signed APK (needs ANDROID_KEYSTORE_* secrets)"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.3"
  GODOT_CHANNEL: "stable"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

       - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$base/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}
          godot --version

      - name: Import resources (headless)
        run: godot --headless --path . --import

      - name: Headless smoke test (non-blocking until the project is verified)
        continue-on-error: true
        run: godot --headless --path . -s tests/smoke_test.gd

      - name: Configure Godot Android editor settings (debug keystore)
        run: |
          mkdir -p ~/.config/godot build
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Export debug APK (debug-signed, for testing only)
        if: ${{ !inputs.release }}
        run: godot --headless --path . --export-debug "Android" build/priora-crash-debug.apk

      - name: Export release APK (signed with repository secrets)
        if: ${{ inputs.release }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          godot --headless --path . --export-release "Android" build/priora-crash-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: priora-crash-apk
          path: build/*.apk
          if-no-files-found: error
